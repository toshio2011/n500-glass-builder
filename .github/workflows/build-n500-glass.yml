name: Build N500 Glass TV APK

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-n500-glass.yml"
      - "tools/patch_glass.py"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build conflict-free APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout N500 builder
        uses: actions/checkout@v4

      - name: Checkout pinned upstream Glass TV
        uses: actions/checkout@v4
        with:
          repository: aqmangge/glass-tv-home
          ref: bfa48608c79074d5e57b9efeb098a64e7601e3cd
          path: _upstream
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "Using Android SDK at $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Patch package ID and prevent incompatible OTA
        run: python3 tools/patch_glass.py _upstream/launcher

      - name: Build Glass TV release APK
        working-directory: _upstream/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Check compiled APK identity
        shell: bash
        run: |
          set -euo pipefail
          apk="_upstream/launcher/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -n 1
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | grep -F "package: name='com.n500.glasstvhome'"
          "$aapt_bin" dump badging "$apk" | grep -F "versionName='2.6.0-n500.1'"
          cp "$apk" n500-glass-tv.apk
          sha256sum n500-glass-tv.apk | tee n500-glass-tv.sha256

      - name: Upload APK for phone installation
        uses: actions/upload-artifact@v4
        with:
          name: N500-Glass-TV-APK
          path: |
            n500-glass-tv.apk
            n500-glass-tv.sha256
          if-no-files-found: error
          retention-days: 30
