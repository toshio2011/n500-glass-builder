name: Build Android Phone Remote APK

on:
  push:
    branches: [feature/android-phone-remote-live-view]
    paths:
      - "phone/**"
      - ".github/workflows/build-n500-phone.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build real native Android phone APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout N500 project
        uses: actions/checkout@v4
      - name: Checkout pinned upstream Gradle 8.9 wrapper (build tool only)
        uses: actions/checkout@v4
        with:
          repository: aqmangge/glass-tv-home
          ref: bfa48608c79074d5e57b9efeb098a64e7601e3cd
          path: _upstream
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle caching
        uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK platforms
        run: |
          test -d "$ANDROID_HOME"
          echo "Installed platforms:"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" || true
          fi
      - name: Build phone Android APK
        run: |
          chmod +x _upstream/launcher/gradlew
          _upstream/launcher/gradlew --no-daemon -p phone :app:assembleDebug
      - name: Verify APK identity / real executable
        shell: bash
        run: |
          set -euo pipefail
          apk="phone/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" | tail -1
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | grep -F "package: name='com.n500.remote'"
          "$aapt_bin" dump badging "$apk" | grep -F "versionName='0.1.0-dev'"
          cp "$apk" n500-glass-tv-remote-phone.apk
          sha256sum n500-glass-tv-remote-phone.apk > n500-glass-tv-remote-phone.sha256
      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: N500-Glass-TV-Remote-PHONE-APK
          path: |
            n500-glass-tv-remote-phone.apk
            n500-glass-tv-remote-phone.sha256
          if-no-files-found: error
          retention-days: 30
